version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expenseease-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - SQLITE_DB_PATH=/app/data/expenseease.db
    volumes:
      - sqlite_data:/app/data
    networks:
      - expenseease-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expenseease-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - expenseease-network

volumes:
  sqlite_data:
    driver: local

networks:
  expenseease-network:
    driver: bridge

